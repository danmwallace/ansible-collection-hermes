---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Apply hermes role with test values
      ansible.builtin.import_role:
        name: danmwallace.hermes.hermes
      vars:
        hermes_domain: test.local
        hermes_dashboard_basic_auth_password: test-password-not-for-production  # molecule-test-only: fake value, not a real credential
        hermes_api_server_key: test-api-key-min8chars  # molecule-test-only: fake value, not a real credential
        hermes_anthropic_api_key: test-anthropic-key  # molecule-test-only: fake value, not a real credential
        hermes_discord_bot_token: test-discord-token  # molecule-test-only: fake value, not a real credential
        hermes_discord_allowed_users: ["111111111111111111", "222222222222222222"]
        hermes_discord_allowed_channels: ["333333333333333333"]
        hermes_terminal_env: local
        # Shaped like ai01's host_vars, which hermes_gateway used to apply.
        hermes_default_model:
          provider: anthropic
          model: claude-opus-5-5
        hermes_config_extra:
          max_concurrent_sessions: 10
          approvals:
            mode: smart
            cron_mode: approve
          terminal:
            backend: local
        hermes_skip_compose: true
