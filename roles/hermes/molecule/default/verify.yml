---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat the deploy and data directories
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - path: /opt/hermes
          mode: "0755"
        - path: /opt/hermes/data
          mode: "0750"
      register: hermes_dirs

    - name: Assert directories exist with correct mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.mode == item.item.mode
      loop: "{{ hermes_dirs.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Stat the rendered docker-compose file
      ansible.builtin.stat:
        path: /opt/hermes/docker-compose.yml
      register: hermes_compose_stat

    - name: Assert docker-compose file rendered with mode 0600
      ansible.builtin.assert:
        that:
          - hermes_compose_stat.stat.exists
          - hermes_compose_stat.stat.mode == '0600'

    - name: Read rendered docker-compose file
      ansible.builtin.slurp:
        src: /opt/hermes/docker-compose.yml
      register: hermes_compose_contents

    - name: Assert docker-compose contains expected values
      vars:
        rendered: "{{ hermes_compose_contents.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'nousresearch/hermes-agent:' in rendered"
          - "'HERMES_DASHBOARD_HOST=0.0.0.0' in rendered"
          - "'API_SERVER_HOST=0.0.0.0' in rendered"
          - "'127.0.0.1' not in rendered"
          - "'HERMES_DASHBOARD=1' in rendered"
          - "'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=test-password-not-for-production' in rendered"  # molecule-test-only: fake value, not a real credential
          - "'API_SERVER_ENABLED=true' in rendered"
          - "'API_SERVER_KEY=test-api-key-min8chars' in rendered"  # molecule-test-only: fake value, not a real credential
          - "'ANTHROPIC_API_KEY=test-anthropic-key' in rendered"  # molecule-test-only: fake value, not a real credential
          - "'hermes-hermes-instance.test.local' in rendered"
          - "'DISCORD_BOT_TOKEN=test-discord-token' in rendered"  # molecule-test-only: fake value, not a real credential
          - "'DISCORD_ALLOWED_USERS=111111111111111111,222222222222222222' in rendered"
          - "'DISCORD_ALLOWED_CHANNELS=333333333333333333' in rendered"

    - name: Stat the .env file
      ansible.builtin.stat:
        path: /opt/hermes/data/.env
      register: hermes_env_stat

    - name: Assert .env rendered with mode 0600
      ansible.builtin.assert:
        that:
          - hermes_env_stat.stat.exists
          - hermes_env_stat.stat.mode == '0600'

    - name: Read rendered .env file
      ansible.builtin.slurp:
        src: /opt/hermes/data/.env
      register: hermes_env_contents

    - name: Assert .env contains API key
      vars:
        rendered: "{{ hermes_env_contents.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ANTHROPIC_API_KEY=test-anthropic-key' in rendered"  # molecule-test-only: fake value, not a real credential

    # Exact content, in the order ai01's wizard-written file has it, so the
    # first run against that host leaves the file alone.
    - name: Assert .env holds the API key and TERMINAL_ENV, nothing else
      ansible.builtin.assert:
        that:
          - (hermes_env_contents.content | b64decode) == expected
      vars:
        expected: "ANTHROPIC_API_KEY=test-anthropic-key\nTERMINAL_ENV=local\n"  # molecule-test-only: fake value, not a real credential

    - name: Render env.j2 without hermes_terminal_env
      ansible.builtin.set_fact:
        hermes_env_without_terminal: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/env.j2') }}"
      vars:
        hermes_anthropic_api_key: test-anthropic-key  # molecule-test-only: fake value, not a real credential
        hermes_openai_api_key: ""
        hermes_google_client_id: ""
        hermes_google_client_secret: ""
        hermes_gmail_refresh_token: ""
        hermes_gcal_refresh_token: ""

    - name: Assert TERMINAL_ENV is left out when hermes_terminal_env is unset
      ansible.builtin.assert:
        that:
          - "'TERMINAL_ENV' not in hermes_env_without_terminal"

    - name: Stat config.yaml
      ansible.builtin.stat:
        path: /opt/hermes/data/config.yaml
      register: hermes_config_stat

    - name: Assert config.yaml is owned by the container user with mode 0640
      ansible.builtin.assert:
        that:
          - hermes_config_stat.stat.exists
          - hermes_config_stat.stat.mode == '0640'
          - hermes_config_stat.stat.uid == 10000
          - hermes_config_stat.stat.gid == 10000

    - name: Read merged config.yaml
      ansible.builtin.slurp:
        src: /opt/hermes/data/config.yaml
      register: hermes_config_contents

    # The idempotence step already shows a second run doesn't rewrite the file.
    - name: Assert the Ansible-owned keys are merged and app-written keys are kept
      vars:
        cfg: "{{ hermes_config_contents.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          # hermes_default_model; the legacy model.model key is dropped
          - cfg.model.provider == 'anthropic'
          - cfg.model.default == 'claude-opus-5-5'
          - "'model' not in cfg.model"
          - cfg.model.options.temperature == 0.2
          # hermes_config_extra, merged recursively
          - cfg.max_concurrent_sessions == 10
          - cfg.approvals.mode == 'smart'
          - cfg.approvals.cron_mode == 'approve'
          - cfg.terminal.backend == 'local'
          # keys Hermes wrote, at the top level and beside merged ones, survive
          - cfg._config_version == 7
          - cfg.gateway.multiplex_profiles
          - cfg.display.theme == 'dark'
          - cfg.approvals.timeout == 120
          - cfg.terminal.shell == '/bin/bash'
