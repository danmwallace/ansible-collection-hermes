---
- name: Assert dashboard password is set when dashboard is enabled
  ansible.builtin.assert:
    that: hermes_dashboard_basic_auth_password | length > 0
    fail_msg: "hermes_dashboard_basic_auth_password must be set (supply from vault)"
  when: hermes_dashboard_enabled

- name: Assert API server key is set when API server is enabled
  ansible.builtin.assert:
    that: hermes_api_server_key | length > 0
    fail_msg: "hermes_api_server_key must be set (minimum 8 characters, supply from vault)"
  when: hermes_api_server_enabled

- name: Assert Anthropic API key is set
  ansible.builtin.assert:
    that: hermes_anthropic_api_key | length > 0
    fail_msg: "hermes_anthropic_api_key must be set (supply from vault)"

- name: Assert Discord allowed users are set when a Discord bot token is set
  ansible.builtin.assert:
    that: hermes_discord_allowed_users | length > 0
    fail_msg: >-
      hermes_discord_allowed_users must list at least one Discord user ID when
      hermes_discord_bot_token is set; without it the bot has no allowlist.
  when: hermes_discord_bot_token | length > 0

- name: Ensure hermes deploy directory exists
  ansible.builtin.file:
    path: "{{ hermes_deploy_dir }}"
    state: directory
    owner: ansible
    group: "{{ hermes_deploy_group }}"
    mode: "0755"
  become: true

- name: Ensure hermes data directory exists
  ansible.builtin.file:
    path: "{{ hermes_data_dir }}"
    state: directory
    owner: "{{ hermes_uid }}"
    group: "{{ hermes_gid }}"
    mode: "0750"
  become: true

- name: Render hermes data .env from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ hermes_data_dir }}/.env"
    owner: "{{ hermes_uid }}"
    group: "{{ hermes_gid }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Restart hermes compose project

- name: Render hermes docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermes_deploy_dir }}/docker-compose.yml"
    owner: ansible
    group: "{{ hermes_deploy_group }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Restart hermes compose project

# Hermes rewrites config.yaml itself: `_config_version` after a migration,
# gateway.multiplex_profiles, model.options and settings changed from chat or
# the dashboard. So the Ansible-owned keys are merged into the live mapping
# rather than rendered from a template, and the file is written only when the
# merged mapping differs from what is on disk; Hermes reformatting the file is
# not a change. Ported from hermes_gateway (same variables, same semantics) so
# that role can be dropped. With both variables empty nothing here changes.
- name: Check whether a config.yaml exists in the data directory
  ansible.builtin.stat:
    path: "{{ hermes_data_dir }}/config.yaml"
  become: true
  register: _hermes_config_stat

- name: Read the live config.yaml
  ansible.builtin.slurp:
    src: "{{ hermes_data_dir }}/config.yaml"
  become: true
  register: _hermes_config_slurp
  when: _hermes_config_stat.stat.exists
  no_log: true

# model is combined non-recursively first to drop the legacy `model.model` key:
# Hermes reads `model.model` in preference to the canonical `model.default`, so
# leaving it behind would pin the old model.
- name: Merge the Ansible-owned keys into the live config
  ansible.builtin.set_fact:
    _hermes_config_current: "{{ _hermes_cfg_live }}"
    _hermes_config_merged: >-
      {{ (_hermes_cfg_live
          | combine({'model': _hermes_cfg_live.model | default({}, true)
                              | dict2items | rejectattr('key', 'eq', 'model') | items2dict})
          | combine({'model': _hermes_cfg_model}, recursive=true)
          if hermes_default_model | length > 0 else _hermes_cfg_live)
         | combine(hermes_config_extra, recursive=true) }}
  vars:
    _hermes_cfg_live: >-
      {{ (_hermes_config_slurp.content | b64decode | from_yaml | default({}, true))
         if _hermes_config_stat.stat.exists else {} }}
    _hermes_cfg_model: >-
      {{ {'provider': hermes_default_model.provider, 'default': hermes_default_model.model}
         | combine({'base_url': hermes_default_model.base_url,
                    'api_key': hermes_default_model.api_key | default('none')}
                   if hermes_default_model.base_url is defined else {})
         if hermes_default_model | length > 0 else {} }}
  no_log: true

- name: Report which top-level config keys the merge changes
  ansible.builtin.debug:
    msg: >-
      config.yaml keys to update:
      {%- set _ns = namespace(keys=[]) -%}
      {%- for _k, _v in _hermes_config_merged.items() if _hermes_config_current.get(_k) != _v -%}
      {%- set _ns.keys = _ns.keys + [_k] -%}
      {%- endfor %} {{ _ns.keys | join(', ') }}
  when: _hermes_config_merged != _hermes_config_current

# Always no_log: the file can hold credentials Hermes stored there itself.
- name: Write config.yaml when the merge changes it
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — danmwallace.hermes.hermes
      # Ansible owns model (when hermes_default_model is set) and the keys in
      # hermes_config_extra; everything else Hermes writes here is kept.
      {{ _hermes_config_merged | to_nice_yaml(indent=2) }}
    dest: "{{ hermes_data_dir }}/config.yaml"
    owner: "{{ hermes_uid }}"
    group: "{{ hermes_gid }}"
    mode: "0640"
  become: true
  when: _hermes_config_merged != _hermes_config_current
  no_log: true
  notify:
    - Restart hermes compose project
    - Restart hermes service

- name: Deploy hermes via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ hermes_deploy_dir }}"
    files:
      - docker-compose.yml
    state: present
    pull: "{{ hermes_pull_policy }}"
  become: true
  when: hermes_deploy_mode == 'docker'
  tags:
    - molecule-notest

- name: Deploy hermes Quadlet container unit
  ansible.builtin.template:
    src: hermes.container.j2
    dest: "{{ hermes_quadlet_dir }}/hermes.container"
    mode: "0644"
  become: true
  when: hermes_deploy_mode == 'quadlet'
  notify: Restart hermes service

- name: Enable and start hermes.service (Quadlet)
  ansible.builtin.systemd:
    name: hermes.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: hermes_deploy_mode == 'quadlet'
  tags:
    - molecule-notest
