---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Ensure data directory exists (normally created by hermes role)
      ansible.builtin.file:
        path: /opt/hermes/data
        state: directory
        owner: ansible
        group: "{{ hermes_gateway_deploy_group | default('docker') }}"
        mode: "0755"
      become: true

    # What Hermes leaves in a live config: keys it writes itself, which the role
    # must keep, and the legacy model.model the old template wrote, which it must
    # drop. force: false writes it only once, so the idempotence run sees the
    # role's own output.
    - name: Ensure a live config.yaml with Hermes-written keys exists
      ansible.builtin.copy:
        content: |
          _config_version: 53
          gateway:
            multiplex_profiles: true
            platforms:
              discord:
                token: revoked-old-token  # molecule-test-only: fake value, not a real credential
                home_channel: "555"
                extra:
                  allow_from: "111111111111111111"
                  allow_admin_from: "222222222222222222"
          model:
            provider: anthropic
            model: claude-old-model
            options:
              reasoning: high
        dest: /opt/hermes/data/config.yaml
        mode: "0640"
        force: false
      become: true

    - name: Apply hermes_gateway role with test values
      ansible.builtin.import_role:
        name: danmwallace.hermes.hermes_gateway
      vars:
        hermes_gateway_create_profiles: false
        hermes_gateway_skip_docker: true
        hermes_data_dir: /opt/hermes/data
        hermes_api_server_key: test-api-key-min8chars  # molecule-test-only: fake value, not a real credential
        hermes_anthropic_api_key: test-anthropic-key  # molecule-test-only: fake value, not a real credential
        hermes_config_extra:
          approvals:
            mode: smart
        hermes_profiles:
          - name: assistant
            soul: |
              You are a helpful assistant for testing.
            gateways:
              - type: discord
                bot_token: test-discord-token  # molecule-test-only: fake value, not a real credential
                allowed_users:
                  - "123456789012345678"
                admin_users: []
