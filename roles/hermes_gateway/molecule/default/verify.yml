---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat the config.yaml file
      ansible.builtin.stat:
        path: /opt/hermes/data/config.yaml
      register: hermes_gateway_config_stat

    - name: Assert config.yaml was rendered
      ansible.builtin.assert:
        that:
          - hermes_gateway_config_stat.stat.exists
          - hermes_gateway_config_stat.stat.mode == '0640'

    - name: Read rendered config.yaml
      ansible.builtin.slurp:
        src: /opt/hermes/data/config.yaml
      register: hermes_gateway_config_contents

    - name: Assert config.yaml holds the managed keys and keeps the Hermes-written ones
      vars:
        cfg: "{{ hermes_gateway_config_contents.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - cfg.model.provider == 'anthropic'
          - cfg.model.default == 'claude-sonnet-4-6'
          - "'model' not in cfg.model"
          - cfg.model.options.reasoning == 'high'
          - cfg._config_version == 53
          - cfg.gateway.multiplex_profiles
          - cfg.gateway.platforms.discord.token == 'test-discord-token'
          - cfg.gateway.platforms.discord.extra.allow_from == '123456789012345678'
          - "'allow_admin_from' not in cfg.gateway.platforms.discord.extra"
          - cfg.gateway.platforms.discord.home_channel == '555'
          - cfg.approvals.mode == 'smart'
        quiet: true
      no_log: true

    - name: Assert config.yaml and the profile directory belong to the container user
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/hermes/data/config.yaml
        - /opt/hermes/data/profiles/assistant
      register: hermes_gateway_owner_stat
      failed_when: >-
        hermes_gateway_owner_stat.stat.uid != 10000 or hermes_gateway_owner_stat.stat.gid != 10000

    - name: Stat the assistant SOUL.md file
      ansible.builtin.stat:
        path: /opt/hermes/data/profiles/assistant/SOUL.md
      register: hermes_gateway_soul_stat

    - name: Assert SOUL.md was rendered
      ansible.builtin.assert:
        that:
          - hermes_gateway_soul_stat.stat.exists

    - name: Read rendered SOUL.md
      ansible.builtin.slurp:
        src: /opt/hermes/data/profiles/assistant/SOUL.md
      register: hermes_gateway_soul_contents

    - name: Assert SOUL.md contains inline soul content
      vars:
        rendered: "{{ hermes_gateway_soul_contents.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'You are a helpful assistant for testing.' in rendered"

    - name: Load role defaults for the bind-address regression check
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"
        name: hermes_gateway_role_defaults

    - name: Assert the gateway API binds on all container interfaces
      ansible.builtin.assert:
        that:
          - hermes_gateway_role_defaults.hermes_gateway_api_server_host == '0.0.0.0'
        fail_msg: >-
          hermes_gateway_api_server_host must default to 0.0.0.0. 127.0.0.1 is the
          container's own loopback and makes the gateway unreachable through Traefik.
