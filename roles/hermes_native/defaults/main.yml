# SPDX-License-Identifier: MIT
---
# OS user the agent runs as
hermes_native_user: hermes

# Where to clone the hermes-agent source
hermes_native_install_dir: /home/hermes/hermes-agent

# GitHub URL for the hermes-agent source repo
hermes_native_repo_url: https://github.com/NousResearch/hermes-agent

# Git branch/tag to check out
hermes_native_repo_version: v0.23.0

# Directory for cloned repos the agent will work on
hermes_native_workspace_dir: /home/hermes/workspace

# Git identity the agent commits as
hermes_native_git_user_name: "Hermes"
hermes_native_git_user_email: "hermes@wallace.boston"

# API server (exposes OpenAI-compatible endpoint for external callers)
hermes_native_api_server_host: "127.0.0.1"
hermes_native_api_server_port: 8642
hermes_native_api_server_key: ""      # supply from vault
hermes_native_api_server_model_name: hermes-agent

# Dashboard (web UI served by the native agent process)
hermes_native_dashboard_enabled: true
hermes_native_dashboard_host: "127.0.0.1"
hermes_native_dashboard_port: 9119
hermes_native_dashboard_username: hermes
hermes_native_dashboard_password: ""  # supply from vault
hermes_native_dashboard_insecure: true

# Model configuration
hermes_native_model_provider: anthropic
hermes_native_model: claude-sonnet-4-6

# Anthropic API key for the agent
hermes_native_anthropic_api_key: ""   # supply from vault

# Fine-grained GitHub PAT for gh CLI auth
hermes_native_gh_token: ""            # supply from vault

# Path for the env file read by the systemd service
hermes_native_env_file: /etc/hermes-agent/env

# Discord gateway (optional — leave bot_token empty to disable)
hermes_native_discord_bot_token: ""   # supply from vault
hermes_native_discord_allowed_users: []
hermes_native_discord_admin_users: []
hermes_native_discord_require_mention: true

# Passwordless sudo for the hermes user (useful for coding-agent workflows)
hermes_native_nopasswd_sudo: false

# Restrict passwordless sudo to specific commands only (requires hermes_native_nopasswd_sudo: true).
# When non-empty, the sudoers entry allows only these commands instead of ALL.
# Example: ["/usr/bin/systemctl", "/usr/bin/podman", "/usr/bin/journalctl"]
hermes_native_sudo_commands: []

# Approvals policy — controls what hermes auto-approves in cron/gateway
# (manual, smart or off; quoted so YAML does not read off as false)
hermes_native_approvals_mode: "manual"
hermes_native_approvals_cron_mode: deny

# Extra config.yaml keys merged on top of the role-managed ones (model,
# approvals, platforms.api_server, gateway.platforms.discord), e.g. a moa
# preset or max_concurrent_sessions. The role merges into the live file, so
# keys Hermes writes itself (_config_version, /sethome channel, model.options)
# survive; removing a key here does not remove it from the host.
hermes_native_config_extra: {}

# Traefik integration — expose the dashboard and/or the API server via HTTPS.
# Traefik runs in a container and reaches these host processes through
# host.containers.internal, so the matching *_host must not be 127.0.0.1.
hermes_native_traefik_conf_dir: /opt/podman/traefik/conf.d
hermes_native_dashboard_traefik_enabled: false
hermes_native_dashboard_traefik_hostname: ""
hermes_native_api_server_traefik_enabled: false
hermes_native_api_server_traefik_hostname: ""

# Additional profiles to provision alongside the default.
# Each entry is a dict with:
#   name:   profile directory name (e.g. "coding")
#   config: mapping rendered verbatim into ~/profiles/<name>/config.yaml
# The default profile config.yaml is managed by the config.yaml.j2 template
# and is not affected by this list.
hermes_native_profiles: []
