---
- name: Prepare
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Ensure the hermes user exists
      ansible.builtin.user:
        name: hermes

    # The role's restart handler needs a unit to restart; the agent itself isn't installed here.
    - name: Ensure a stub hermes-agent.service exists
      ansible.builtin.copy:
        dest: /etc/systemd/system/hermes-agent.service
        mode: "0644"
        content: |
          [Service]
          ExecStart=/usr/bin/sleep infinity

    - name: Ensure the desktop profile folder exists
      ansible.builtin.file:
        path: /home/hermes/profiles/desktop
        state: directory
        owner: hermes
        group: hermes
        mode: "0700"

    # A key Hermes (or a person) put there; the role must leave it alone.
    - name: Ensure the profile .env already holds another key
      ansible.builtin.copy:
        dest: /home/hermes/profiles/desktop/.env
        content: "OTHER=keep\n"
        owner: hermes
        group: hermes
        mode: "0600"
