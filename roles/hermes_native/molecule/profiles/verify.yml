---
- name: Verify
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Read the profile .env
      ansible.builtin.slurp:
        src: /home/hermes/profiles/desktop/.env
      register: hermes_native_verify_env

    - name: Read the profile .env attributes
      ansible.builtin.stat:
        path: /home/hermes/profiles/desktop/.env
      register: hermes_native_verify_stat

    - name: Check the key line was added and the other line kept
      ansible.builtin.assert:
        that:
          - (hermes_native_verify_env.content | b64decode).splitlines() | sort == ['API_SERVER_KEY=molecule-key-0123456789abcdef', 'OTHER=keep']
          - hermes_native_verify_stat.stat.mode == '0600'
          - hermes_native_verify_stat.stat.pw_name == 'hermes'
        quiet: true

    - name: Read the profile config
      ansible.builtin.slurp:
        src: /home/hermes/profiles/desktop/config.yaml
      register: hermes_native_verify_config

    - name: Check approvals are manual
      ansible.builtin.assert:
        that: (hermes_native_verify_config.content | b64decode | from_yaml).approvals.mode == 'manual'
        quiet: true

    - name: Apply a key that is too short
      block:
        - name: Run the profile tasks with a short key
          ansible.builtin.include_role:
            name: danmwallace.hermes.hermes_native
            tasks_from: profiles.yml
          vars:
            hermes_native_user: hermes
            hermes_native_profiles:
              - name: desktop
                api_server_key: tooshortkey
        - name: Fail, because the short key was accepted
          ansible.builtin.fail:
            msg: a key under 16 characters was accepted
      rescue:
        - name: Check the failure is the length check and doesn't show the key
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('16')
              - "'tooshortkey' not in (ansible_failed_result | to_json)"
            quiet: true

    # A symlink planted by the hermes user must not let the play write a root-only file.
    - name: Ensure a root-only target exists
      ansible.builtin.copy:
        dest: /root/target
        content: "root-only\n"
        owner: root
        group: root
        mode: "0600"

    - name: Replace the profile .env with a symlink to it, as the hermes user
      ansible.builtin.command:
        argv: [ln, -sfn, /root/target, /home/hermes/profiles/desktop/.env]
      become: true
      become_user: hermes
      changed_when: true

    - name: Apply the profile tasks against the planted symlink
      block:
        - name: Run the profile tasks
          ansible.builtin.include_role:
            name: danmwallace.hermes.hermes_native
            tasks_from: profiles.yml
          vars:
            hermes_native_user: hermes
            hermes_native_profiles:
              - name: desktop
                api_server_key: molecule-key-0123456789abcdef
      rescue:
        - name: Note that the write was refused
          ansible.builtin.debug:
            msg: refused, as it should be

    - name: Read the root-only target
      ansible.builtin.stat:
        path: /root/target
      register: hermes_native_verify_target

    - name: Read its content
      ansible.builtin.slurp:
        src: /root/target
      register: hermes_native_verify_target_content

    - name: Check the root-only file is untouched
      ansible.builtin.assert:
        that:
          - hermes_native_verify_target.stat.pw_name == 'root'
          - hermes_native_verify_target.stat.mode == '0600'
          - (hermes_native_verify_target_content.content | b64decode) == 'root-only\n'
        quiet: true

    # The profile folder itself, swapped for a symlink to a root-owned folder, must not lead the
    # play to chown or chmod that folder.
    - name: Ensure a root-owned folder exists
      ansible.builtin.file:
        path: /opt/rootdir
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Replace the profile folder with a symlink to it, as the hermes user
      ansible.builtin.shell:
        cmd: rm -rf /home/hermes/profiles/desktop && ln -s /opt/rootdir /home/hermes/profiles/desktop
      become: true
      become_user: hermes
      changed_when: true

    - name: Apply the profile tasks against the planted folder symlink
      block:
        - name: Run the profile tasks
          ansible.builtin.include_role:
            name: danmwallace.hermes.hermes_native
            tasks_from: profiles.yml
          vars:
            hermes_native_user: hermes
            hermes_native_profiles:
              - name: desktop
                config:
                  approvals:
                    mode: manual
      rescue:
        - name: Note that the change was refused
          ansible.builtin.debug:
            msg: refused, as it should be

    - name: Read the root-owned folder
      ansible.builtin.stat:
        path: /opt/rootdir
      register: hermes_native_verify_rootdir

    - name: Check the root-owned folder is untouched
      ansible.builtin.assert:
        that:
          - hermes_native_verify_rootdir.stat.pw_name == 'root'
          - hermes_native_verify_rootdir.stat.mode == '0755'
        fail_msg: "/opt/rootdir is now {{ hermes_native_verify_rootdir.stat.pw_name }} {{ hermes_native_verify_rootdir.stat.mode }}"
        quiet: true

- name: Verify the key stays out of verbose output
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Run converge again at -vvv
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -vvv
          - -i
          - "{{ lookup('env', 'MOLECULE_INVENTORY_FILE') }}"
          - "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/converge.yml"
      environment:
        ANSIBLE_ROLES_PATH: "{{ lookup('env', 'ANSIBLE_ROLES_PATH') }}"
      register: hermes_native_verify_vvv
      changed_when: false
      failed_when: false

    - name: Check the key appears nowhere in it
      ansible.builtin.assert:
        that:
          - "'molecule-key-0123456789abcdef' not in hermes_native_verify_vvv.stdout"
          - "'molecule-key-0123456789abcdef' not in hermes_native_verify_vvv.stderr"
          - "'PLAY RECAP' in hermes_native_verify_vvv.stdout"
        fail_msg: "the key appeared in -vvv output (rc={{ hermes_native_verify_vvv.rc }})"
        quiet: true
