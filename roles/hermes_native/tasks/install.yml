---
- name: Clone hermes-agent source
  ansible.builtin.git:
    repo: "{{ hermes_native_repo_url }}"
    dest: "{{ hermes_native_install_dir }}"
    version: "{{ hermes_native_repo_version }}"
    single_branch: true
    update: true
    force: true
  become: true
  become_user: "{{ hermes_native_user }}"
  register: hermes_native_git_clone
  notify: Restart hermes-agent service

# uv.lock only supports the Python upstream built the release for, so a venv
# left over from an older Python makes `uv sync --frozen` refuse to run. The
# interpreter version is read from the venv's own pyvenv.cfg (uv writes
# `version_info = 3.11.15`, the stdlib writes `version = ...`) and the venv is
# rebuilt when its major.minor differs from hermes_native_python_version.
- name: Check whether the hermes-agent venv exists
  ansible.builtin.stat:
    path: "{{ hermes_native_install_dir }}/venv/pyvenv.cfg"
  become: true
  register: _hermes_native_venv_cfg_stat

- name: Read the Python version of the existing venv
  ansible.builtin.slurp:
    src: "{{ hermes_native_install_dir }}/venv/pyvenv.cfg"
  become: true
  register: _hermes_native_venv_cfg
  when: _hermes_native_venv_cfg_stat.stat.exists

- name: Remove the hermes-agent venv when it was built with another Python
  ansible.builtin.file:
    path: "{{ hermes_native_install_dir }}/venv"
    state: absent
  become: true
  vars:
    _hermes_native_venv_python: >-
      {{ _hermes_native_venv_cfg.content | b64decode
         | regex_search('(?m)^version(_info)?\s*=\s*(\d+\.\d+)', '\2')
         | default([''], true) | first }}
  when:
    - _hermes_native_venv_cfg_stat.stat.exists
    - _hermes_native_venv_python != hermes_native_python_version | string
  register: _hermes_native_venv_removed

- name: Create hermes-agent venv
  ansible.builtin.command:
    cmd: "/home/{{ hermes_native_user }}/.local/bin/uv venv venv --python {{ hermes_native_python_version }}"
    chdir: "{{ hermes_native_install_dir }}"
  become: true
  become_user: "{{ hermes_native_user }}"
  environment:
    HOME: "/home/{{ hermes_native_user }}"
    UV_NO_CONFIG: "1"
  args:
    creates: "{{ hermes_native_install_dir }}/venv/bin/activate"
  register: _hermes_native_venv_created

- name: Normalise the wanted uv extras
  ansible.builtin.set_fact:
    _hermes_native_extras_wanted: "{{ hermes_native_uv_extras | map('string') | sort | join(' ') }}"

- name: Check which extras the venv was last synced with
  ansible.builtin.stat:
    path: "{{ hermes_native_install_dir }}/venv/.ansible-uv-extras"
  become: true
  register: _hermes_native_extras_stat

- name: Read the extras the venv was last synced with
  ansible.builtin.slurp:
    src: "{{ hermes_native_install_dir }}/venv/.ansible-uv-extras"
  become: true
  register: _hermes_native_extras_marker
  when: _hermes_native_extras_stat.stat.exists

- name: Install hermes-agent dependencies via uv sync  # noqa: no-handler
  ansible.builtin.command:
    # --frozen: install exactly what uv.lock at the pinned tag says and never
    # rewrite the lockfile. Without it uv modified uv.lock, the git task with
    # force: true reset it on the next run, and both reported changed forever.
    argv: >-
      {{ ['/home/' ~ hermes_native_user ~ '/.local/bin/uv', 'sync', '--frozen']
         + (hermes_native_uv_extras | map('regex_replace', '^', '--extra=') | list) }}
    chdir: "{{ hermes_native_install_dir }}"
  become: true
  become_user: "{{ hermes_native_user }}"
  environment:
    HOME: "/home/{{ hermes_native_user }}"
    UV_PROJECT_ENVIRONMENT: "{{ hermes_native_install_dir }}/venv"
    UV_NO_CONFIG: "1"
  when: >-
    hermes_native_git_clone is changed
    or _hermes_native_venv_removed is changed
    or _hermes_native_venv_created is changed
    or not _hermes_native_extras_stat.stat.exists
    or (_hermes_native_extras_marker.content | b64decode | trim) != _hermes_native_extras_wanted
  changed_when: true
  notify: Restart hermes-agent service

- name: Record the extras the venv is synced with
  ansible.builtin.copy:
    content: "{{ _hermes_native_extras_wanted }}\n"
    dest: "{{ hermes_native_install_dir }}/venv/.ansible-uv-extras"
    owner: "{{ hermes_native_user }}"
    group: "{{ hermes_native_user }}"
    mode: "0644"
  become: true
