---
- name: Install coding agent system packages
  ansible.builtin.dnf:
    name:
      - git
      - make
      - jq
      - yq
      - ripgrep
      - python3
      - python3-pip
      - curl
      - nodejs
      - npm
    state: present
  become: true
  when: not hermes_native_ostree_booted.stat.exists
