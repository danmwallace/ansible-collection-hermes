---
- name: Provision additional Hermes profiles
  when: hermes_native_profiles | length > 0
  block:
    - name: Ensure profile directories exist
      ansible.builtin.file:
        path: "/home/{{ hermes_native_user }}/profiles/{{ _profile.name }}"
        state: directory
        owner: "{{ hermes_native_user }}"
        group: "{{ hermes_native_user }}"
        # Hermes tightens its profile directories to 0700 on every start;
        # declaring anything looser made this task report changed on each run.
        mode: "0700"
      become: true
      loop: "{{ hermes_native_profiles }}"
      loop_control:
        loop_var: _profile
        label: "{{ _profile.name }}"

    - name: Merge the declared profile configs into the live files
      ansible.builtin.include_tasks: profile_config.yml
      loop: "{{ hermes_native_profiles }}"
      loop_control:
        loop_var: _profile
        label: "{{ _profile.name }}"
