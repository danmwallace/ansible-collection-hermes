---
# systemd runs the services as init_t; files under a home directory are
# user_home_t / data_home_t, which init_t may not execute under SELinux
# enforcing. Label the venv entry points and uv's Python as bin_t, persistently
# (fcontext) and now (restorecon). The home path is resolved first because on
# bootc hosts /home is a symlink to /var/home and fcontext rules match the
# real path.
- name: Resolve the real paths of the hermes home and install directories
  ansible.builtin.command: readlink -f "/home/{{ hermes_native_user }}" "{{ hermes_native_install_dir }}"
  register: hermes_native_real_paths
  changed_when: false
  check_mode: false  # read-only; without this check mode skips it and the set_fact below fails

- name: Keep the resolved paths in named facts
  ansible.builtin.set_fact:
    hermes_native_home_real: "{{ hermes_native_real_paths.stdout_lines[0] }}"
    hermes_native_install_dir_real: "{{ hermes_native_real_paths.stdout_lines[1] }}"

- name: Ensure SELinux file contexts mark the agent executables as bin_t
  community.general.sefcontext:
    target: "{{ item }}"
    setype: bin_t
    state: present
  loop:
    - "{{ hermes_native_install_dir_real }}/venv/bin(/.*)?"
    - "{{ hermes_native_home_real }}/.local/share/uv/python(/.*)?/bin(/.*)?"
  become: true
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

# uv downloads its own Python only when no suitable system Python exists; on
# hosts whose image ships the pinned version (python3.14 on Fedora 44) the venv
# points at /usr/bin and the folder is never created, so only relabel it if present.
- name: Check for uv's managed Python
  ansible.builtin.stat:
    path: "{{ hermes_native_home_real }}/.local/share/uv/python"
  register: hermes_native_uv_python
  become: true
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Ensure the agent executables carry their SELinux labels
  ansible.builtin.command:
    argv: "{{ ['restorecon', '-Rv', hermes_native_install_dir_real ~ '/venv/bin']
              + ([hermes_native_uv_python.stat.path] if hermes_native_uv_python.stat.exists else []) }}"
  register: hermes_native_restorecon
  # -v also prints "not reset as customized by admin" for files it leaves alone;
  # only an actual relabel is a change.
  changed_when: "'Relabeled' in hermes_native_restorecon.stdout"
  become: true
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'
  notify: Restart hermes-agent service
