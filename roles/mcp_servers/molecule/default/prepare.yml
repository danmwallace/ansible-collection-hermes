---
- name: Prepare
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Ensure the two test users exist (one per platform mode)
      ansible.builtin.user:
        name: "{{ item }}"
        create_home: true
      loop: [devreg, devcli, devmove]

    # The role starts hypr-mcp sync (systemctl --user) when the registry changed and the user's
    # systemd runs. A wrapper logs --user calls (with the caller and XDG_RUNTIME_DIR) instead of
    # running them, and passes everything else to the real systemctl.
    - name: Ensure the real systemctl is kept aside
      ansible.builtin.command:
        cmd: mv /usr/bin/systemctl /usr/bin/systemctl.real
        creates: /usr/bin/systemctl.real

    - name: Install a systemctl wrapper that logs --user calls
      ansible.builtin.copy:
        dest: /usr/bin/systemctl
        mode: "0755"
        content: |
          #!/usr/bin/bash
          if [ "$1" = "--user" ]; then
              echo "$(id -un) XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-} $*" >> /tmp/systemctl-user.log
              exit 0
          fi
          exec /usr/bin/systemctl.real "$@"

    - name: Ensure the user-call log is writable by the test users
      ansible.builtin.file:
        path: /tmp/systemctl-user.log
        state: touch
        mode: "0666"
        modification_time: preserve
        access_time: preserve

    - name: Install a stand-in MCP server that prints how it was started
      ansible.builtin.copy:
        dest: /usr/bin/testsrv
        mode: "0755"
        content: |
          #!/usr/bin/bash
          echo "$* ${LOG_LEVEL:-} ${ROUTER_PASS:-}"

    # Records each call and, like the real CLI, writes add-json's server into
    # ~/.claude.json, so a second run can see it is already there.
    - name: Install a stand-in claude CLI
      ansible.builtin.copy:
        dest: /usr/local/bin/claude
        mode: "0755"
        content: |
          #!/usr/bin/python3
          import json, os, sys
          home = os.path.expanduser("~")
          with open(os.path.join(home, "claude-calls.log"), "a") as log:
              log.write(" ".join(sys.argv[1:]) + "\n")
          path = os.path.join(home, ".claude.json")
          data = json.load(open(path)) if os.path.exists(path) else {}
          a = sys.argv[1:]
          if a[:4] == ["mcp", "add-json", "-s", "user"]:
              data.setdefault("mcpServers", {})[a[4]] = json.loads(a[5])
          elif a[:4] == ["mcp", "remove", "-s", "user"]:
              data.get("mcpServers", {}).pop(a[4], None)
          json.dump(data, open(path, "w"))

    # Account details Claude Code keeps in ~/.claude.json must not show up in -v output.
    - name: Give devcli a ~/.claude.json with account details
      ansible.builtin.copy:
        dest: /home/devcli/.claude.json
        owner: devcli
        mode: "0600"
        content: '{"oauthAccount": {"emailAddress": "pii-sentinel@example.invalid"}}'
        force: false

    # github_release: a stand-in release (a tar.gz holding one binary) served over HTTP
    # the way github.com serves assets; converge reads its sha256 from /srv/release/sha256.
    - name: Build a stand-in GitHub release
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          d=/srv/release/danmwallace/fakesrv/releases/download/v1.0.0
          mkdir -p "$d" /tmp/fakesrv
          printf '#!/usr/bin/bash\necho fakesrv ok\n' > /tmp/fakesrv/fakesrv-linux-amd64
          chmod 0755 /tmp/fakesrv/fakesrv-linux-amd64
          tar -C /tmp/fakesrv -czf "$d/fakesrv-linux-amd64.tar.gz" fakesrv-linux-amd64
          sha256sum "$d/fakesrv-linux-amd64.tar.gz" | cut -d' ' -f1 > /srv/release/sha256
        executable: /bin/bash
        creates: /srv/release/sha256

    - name: Serve the stand-in release on 127.0.0.1:8000
      ansible.builtin.command:
        cmd: systemd-run --unit=fakerel python3 -m http.server 8000 --bind 127.0.0.1 --directory /srv/release
      changed_when: true

    - name: Wait for the release server
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        timeout: 30

    # uv_tool: a one-module package in a local git repo, tagged v0.1.0. devreg owns it so
    # git's safe.directory check lets uv (running as devreg) fetch it. Its build backend
    # comes from PyPI, so this scenario needs network.
    - name: Build a stand-in package repo for uv_tool
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          d=/srv/fakepkg
          mkdir -p "$d"
          cat > "$d/pyproject.toml" <<'TOML'
          [build-system]
          requires = ["setuptools>=61"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "fakepkg"
          version = "0.1.0"

          [project.scripts]
          fakepkg-mcp = "fakepkg:main"

          [tool.setuptools]
          py-modules = ["fakepkg"]
          TOML
          sed -i 's/^          //' "$d/pyproject.toml"
          printf 'def main():\n    print("fakepkg ok")\n' > "$d/fakepkg.py"
          git -C "$d" init -q
          git -C "$d" -c user.name=t -c user.email=t@example.invalid add -A
          git -C "$d" -c user.name=t -c user.email=t@example.invalid commit -q -m init
          git -C "$d" tag v0.1.0
          chown -R devreg: "$d"
        executable: /bin/bash
        creates: /srv/fakepkg/.git
