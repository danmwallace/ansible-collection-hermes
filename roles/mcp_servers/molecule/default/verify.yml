---
- name: Verify
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Read the registry entry
      ansible.builtin.slurp:
        src: /home/devreg/.config/atomic-hyprland/mcp.d/testsrv.json
      register: mcp_servers_verify_registry

    - name: Check the registry entry holds a credential reference, not the secret
      ansible.builtin.assert:
        that:
          - (mcp_servers_verify_registry.content | b64decode | from_json) == expected
          - "'s3cr3t-value' not in (mcp_servers_verify_registry.content | b64decode)"
        quiet: true
      vars:
        expected:
          command: /usr/bin/testsrv
          args: [serve]
          env:
            LOG_LEVEL: info
            ROUTER_PASS: { credential: testsrv-router_pass }
          readOnlyTools: [list_things]

    - name: Check the secret is nowhere in plain text and the files landed
      ansible.builtin.shell:
        cmd: |
          set -e
          ! grep -rqs s3cr3t-value /home/devreg /home/devcli --exclude=claude-calls.log
          test "$(stat -c '%a %U' /home/devreg/.config/atomic-hyprland/credentials/testsrv-router_pass.cred)" = "600 devreg"
          test "$(stat -c '%a %U' /home/devcli/.local/share/mcp-servers/credentials/testsrv-router_pass.cred)" = "600 devcli"
          test "$(stat -c '%a %U' /home/devreg/.testsrv/routers.yaml)" = "600 devreg"
          test "$(stat -c '%a %U' /home/devcli/.local/libexec/mcp-servers/testsrv)" = "755 devcli"
          test "$(grep -c 'mcp add-json -s user testsrv' /home/devcli/claude-calls.log)" = 1
          ! test -e /home/devreg/claude-calls.log
        executable: /bin/bash
      changed_when: false

    - name: Decrypt the registry credential the way hypr-mcp run does (no --name)
      become: true
      become_user: devreg
      ansible.builtin.command:
        cmd: systemd-creds --user decrypt /home/devreg/.config/atomic-hyprland/credentials/testsrv-router_pass.cred -
      register: mcp_servers_verify_decrypt
      changed_when: false

    - name: Start the server through the claude_cli launcher
      become: true
      become_user: devcli
      ansible.builtin.command:
        cmd: /home/devcli/.local/libexec/mcp-servers/testsrv
      register: mcp_servers_verify_launch
      changed_when: false

    - name: Check both paths deliver the secret to the server
      ansible.builtin.assert:
        that:
          - mcp_servers_verify_decrypt.stdout == 's3cr3t-value'
          - mcp_servers_verify_launch.stdout == 'serve info s3cr3t-value'
        quiet: true
