---
# SPDX-License-Identifier: MIT
# <name>.cred must be encrypted with --name=<name>.cred: atomic-hyprland's hypr-mcp run
# decrypts without --name, and systemd-creds then expects the file's own name.
- name: Settle the credential's name and path
  ansible.builtin.set_fact:
    mcp_servers_cred_file: "{{ mcp_servers_cred_dir }}/{{ mcp_servers_server.name }}-{{ mcp_servers_secret.key | lower }}.cred"

- name: Read the stored credential to see whether it changed
  become: true
  become_user: "{{ mcp_servers_user }}"
  ansible.builtin.command:
    cmd: systemd-creds --user decrypt {{ mcp_servers_cred_file | quote }} -
  register: mcp_servers_current
  changed_when: false
  failed_when: false
  no_log: true

# systemd-creds output differs on every run, so it is only rewritten when the value changed.
- name: Ensure the credential holds the current value
  ansible.builtin.command:
    cmd: >-
      systemd-creds encrypt --user --uid={{ mcp_servers_user | quote }}
      --name={{ mcp_servers_cred_file | basename | quote }} - {{ mcp_servers_cred_file | quote }}
    stdin: "{{ mcp_servers_secret.value }}"
    stdin_add_newline: false
  when: mcp_servers_current.rc != 0 or mcp_servers_current.stdout != (mcp_servers_secret.value | string)
  changed_when: true
  no_log: true

- name: Ensure the credential belongs to the user alone
  ansible.builtin.file:
    path: "{{ mcp_servers_cred_file }}"
    owner: "{{ mcp_servers_user }}"
    mode: "0600"
