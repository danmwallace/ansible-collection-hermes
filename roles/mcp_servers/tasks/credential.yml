---
# SPDX-License-Identifier: MIT
# Every step runs as the user, never as root: the path is inside the user's home, and a
# root write or chown there could be pointed elsewhere with a symlink. The user can
# encrypt its own credentials (systemd-creds --user), with or without a login session.
#
# <name>.cred must be encrypted with --name=<name>.cred: atomic-hyprland's hypr-mcp run
# decrypts without --name, and systemd-creds then expects the file's own name.
- name: Settle the credential's name and path
  ansible.builtin.set_fact:
    mcp_servers_cred_file: "{{ mcp_servers_cred_dir }}/{{ mcp_servers_server.name }}-{{ mcp_servers_secret.key | lower }}.cred"

- name: Check the credential's path
  become: true
  become_user: "{{ mcp_servers_user }}"
  ansible.builtin.stat:
    path: "{{ mcp_servers_cred_file }}"
    follow: false
  register: mcp_servers_cred_stat

- name: Stop when something other than a plain file sits at the credential's path
  ansible.builtin.fail:
    msg: "{{ mcp_servers_cred_file }} is a symlink or not a regular file; remove it and run again."
  when: mcp_servers_cred_stat.stat.exists and not mcp_servers_cred_stat.stat.isreg

- name: Read the stored credential to see whether it changed
  become: true
  become_user: "{{ mcp_servers_user }}"
  ansible.builtin.command:
    cmd: systemd-creds --user decrypt {{ mcp_servers_cred_file | quote }} -
  register: mcp_servers_current
  changed_when: false
  failed_when: false
  no_log: true

# systemd-creds output differs on every run, so it is only rewritten when the value changed.
- name: Ensure the credential holds the current value
  become: true
  become_user: "{{ mcp_servers_user }}"
  ansible.builtin.command:
    cmd: >-
      systemd-creds --user encrypt --name={{ mcp_servers_cred_file | basename | quote }}
      - {{ mcp_servers_cred_file | quote }}
    stdin: "{{ mcp_servers_secret.value }}"
    stdin_add_newline: false
  when: mcp_servers_current.rc != 0 or mcp_servers_current.stdout != (mcp_servers_secret.value | string)
  changed_when: true
  no_log: true

- name: Ensure the credential is readable by the user alone
  become: true
  become_user: "{{ mcp_servers_user }}"
  ansible.builtin.file:
    path: "{{ mcp_servers_cred_file }}"
    mode: "0600"
